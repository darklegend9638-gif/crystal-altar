name: restore-img
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          P=app/src/main/assets/assets/img
          C=$(git log -1 --diff-filter=D --format=%H -- "$P")
          echo "delete commit: $C"
          git checkout "${C}^" -- "$P"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Restore img folder"
          git push
